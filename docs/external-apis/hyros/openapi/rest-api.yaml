openapi: 3.1.0
info:
  title: Hyros API
  version: "1.40"
  description: |
    ## Status Codes

    | Code | Meaning |
    |------|---------|
    | `200 OK` | Response to a successful GET, PUT, POST or DELETE |
    | `400 Bad Request` | Malformed request; form validation errors |
    | `401 Unauthorized` | Wrong Api-Key or not provided |
    | `403 Forbidden` | Api-Key is valid but lacks a role the endpoint requires (`Missing role <ROLE>`), or the Accessible-Account-Id header targets an account that is not one of the caller's connected client accounts |
    | `429 Too Many Requests` | Number of API requests per second exceeded |

    ## Unrecognized parameters and fields

    On the endpoints listed below, requests must contain only documented query parameters and body fields. An unknown query parameter, an unknown top-level body field, or a query parameter repeated more than once, is rejected with `400 Bad Request` naming the offender instead of being ignored. The error body lists the offenders as `Unknown parameter: <name>`, `Duplicate parameter: <name>` or `Unknown field: <name>`. For example, `GET /api/v1.0/products?bogus=1` returns `400` with `Unknown parameter: bogus`.

    Endpoints that enforce this:

    - `GET /api/v1.0/products`, `PUT /api/v1.0/products/{id}`, `DELETE /api/v1.0/products/{id}`
    - `GET /api/v1.0/carts`
    - `GET /api/v1.0/custom-costs`, `PUT /api/v1.0/custom-costs/{id}`, `DELETE /api/v1.0/custom-costs/{id}`
    - `PUT /api/v1.0/sources/{tag}`, `DELETE /api/v1.0/sources/{tag}`
    - `GET /api/v1.0/tags/count`
    - `GET /api/v1.0/attribution/roas`
    - `GET /api/v1.0/requests/{request_id}`

    On every other endpoint, unknown query parameters and unknown body fields are ignored, and a repeated query parameter takes its first value. The request succeeds and the unrecognized input has no effect, so a typo silently changes what you get back: `GET /api/v1.0/leads?email=someone@example.com` is not a filter on `emails`, it returns the unfiltered lead list. Keep your own input validation in place for those endpoints.

    ## Rate Limiting

    | Limit Type | Requests | Window |
    |------------|----------|--------|
    | Per Second | 30 | 1 second |
    | Per Minute | 1000 | 60 seconds |

    | Header | Description | Example |
    |--------|-------------|---------|
    | `X-RateLimit-Limit` | Rate limit policy (`capacity;w=window_seconds`) | `30;w=1, 1000;w=60` |
    | `X-RateLimit-Remaining` | Requests remaining in the most restrictive window | `25` |
    | `X-RateLimit-Reset` | Unix timestamp when the rate limit resets | `1707235200` |
    | `Retry-After` | Seconds to wait before retrying | `1` |

    ## Asynchronous Processing

    Write operations (creates, updates and deletes) are processed **asynchronously**. A `200` response means the request was received and validated; the change is applied afterwards and may not be visible on an immediate read-back. Creates are typically visible within ~10 seconds. Updates and deletes typically take ~5 minutes, and can take longer under heavy load. Read (`GET`) operations are synchronous and return current data. Asynchronous operations are flagged with an **Asynchronous** note.

    ## Agency Access to Client Accounts

    Agencies can act on a connected client account, identified by its external id, on both API surfaces. The rule is the same everywhere: the caller must have an approved connected-account relation with the target account, the request then runs against that account instead of the caller's own, and any other target is rejected with an authorization error (`Not authorized: account <id> is not one of your connected client accounts.`). When no account id is sent, the request operates on the caller's own account. Rate limits always apply to the caller.

    * **REST API**: send the optional `Accessible-Account-Id` header on any `/api/v1.0` request. Unauthorized targets are rejected with `403 Forbidden` and the standard error body (`result: ERROR`).
    * **MCP tools**: pass the optional `accessible_account_id` tool argument. It is advertised in `tools/list` only to agency accounts but validated on every call; unauthorized targets produce a tool error. Tools that are not tied to an account's data (docs search, integration types) and admin tools (which take a `productId` argument instead) do not accept it.

security:
  - ApiKeyAuth: []

tags:
  - name: Leads
  - name: Sales
  - name: Orders
  - name: Calls
  - name: Attribution
  - name: Ad Accounts
  - name: Products
  - name: Tags
  - name: Sources
  - name: Custom Costs
  - name: Clicks
  - name: Carts
  - name: User Info
  - name: Keywords
  - name: Subscriptions
  - name: Tracking Script
  - name: Domains
  - name: Stages
  - name: Webhook Subscriptions

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: API-Key

  schemas:
    SuccessResponse:
      type: object
      properties:
        request_id:
          type: string
        result:
          type: string
          example: OK

    ErrorResponse:
      type: object
      properties:
        result:
          type: string
          example: ERROR
        message:
          type: array
          items:
            type: string

    WebhookSubscription:
      type: object
      properties:
        externalId:
          type: string
          description: Opaque identifier of the subscription.
          example: sub-2a475f6baf8f416bac9ff60e1a0fabb5
        name:
          type: string
          example: My CRM sync
        targetUrl:
          type: string
          description: Public `http`/`https` URL where the event payloads are sent via POST.
          example: https://example.com/hooks/hyros
        eventTypes:
          type: array
          items:
            type: string
            enum:
              - sale.attributed
              - sale.refunded
              - call.attributed
              - lead.opted.in
              - lead.opted.in.first.time
              - lead.origin.assigned
              - lead.stage.changed
              - lead.tag.added
              - lead.tag.removed
              - subscription.created
              - subscription.status.changed
          example: ['sale.attributed', 'lead.opted.in']
        state:
          type: string
          enum: [ACTIVE, DELETED, AUTOMATIC_PAUSED, MANUALLY_PAUSED]
          example: ACTIVE
        secretKey:
          type: string
          description: Secret used to validate the HMAC signature of delivered events. Returned once, in the create (`POST`) response; it is not included in the list (`GET`) response. It can also be found in the Hyros app under Settings → Integrations → Hyros Webhook Subscription.
          example: ssk-244e8d359f67456cb9efac27913283fb
        creationDate:
          type: string
          description: Creation date, in UTC.
          example: '2026-07-09T14:28:15Z'
        lastDeliveryDate:
          type: string
          nullable: true
          description: Date of the last event delivery, in UTC. `null` if no event has been delivered yet.
          example: '2026-07-09T15:13:20Z'

    AdspendType:
      type: string
      enum: [FACEBOOK, GOOGLE, GOOGLE_V2, TIKTOK, SNAPCHAT, LINKEDIN, TWITTER, PINTEREST, BING, REDDIT, APPLOVIN, WHOP_ADS]

    AdspendSubType:
      type: string
      enum: [DISPLAY, VIDEO]

    SubscriptionStatus:
      type: string
      enum: [ACTIVE, TRIALING, CANCELED, PAST_DUE, INCOMPLETE, INCOMPLETE_EXPIRED, UNPAID, COMPLETED, PAUSED]

    CallState:
      type: string
      enum: [QUALIFIED, UNQUALIFIED, CANCELLED, NO_SHOW]

    AdOptimizationConsent:
      type: string
      enum: [GRANTED, DENIED, UNSPECIFIED]

    Item:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          description: Name of the product.
        price:
          type: number
          description: Product price per unit (costOfGoods included).
        externalId:
          type: string
          description: Unique identifier from the external integration.
        quantity:
          type: number
          description: Number of copies purchased. Defaults to 1.
          default: 1
        sku:
          type: string
          description: Unique product reference code.
        costOfGoods:
          type: number
          description: Cost per unit of manufacture. Must be included in the price. Defaults to 0.
          default: 0
        taxes:
          type: number
          description: Taxes applied to the item per unit. Defaults to 0.
          default: 0
        itemDiscount:
          type: number
          description: Discount applied to this specific line item.
        packages:
          type: array
          items:
            type: string
          description: Product packages this item belongs to (used for recurring sales attribution).
        isRebill:
          type: boolean
          description: If true, the sale is marked as recurring even if it's the first one.
        tag:
          type: string
          description: Tag to create for the sale item.
        categoryName:
          type: string
          description: Links the sale to a product category.

    CartItem:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        price:
          type: number
        externalId:
          type: string
        quantity:
          type: number
          default: 1
        sku:
          type: string
          description: Unique product reference code.
        isRebill:
          type: boolean
          description: If true, the sale is marked as recurring even if it's the first one.

    Provider:
      type: object
      properties:
        id:
          type: string
          description: ID of lead in external platform.
        integration:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
            id:
              type: string
              description: Account ID of the integration.

    AdSource:
      type: object
      properties:
        adSourceId:
          type: string
        adAccountId:
          type: string
        platform:
          $ref: '#/components/schemas/AdspendType'

    TrafficSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Goal:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    SourceLinkAd:
      type: object
      properties:
        name:
          type: string
        adSourceId:
          type: string

    Attribution:
      type: object
      properties:
        sourceLinkId:
          type: string
        name:
          type: string
        tag:
          type: string
        disregarded:
          type: boolean
        organic:
          type: boolean
        clickDate:
          type: string
        clickId:
          type: string
        adSource:
          $ref: '#/components/schemas/AdSource'
        sourceLinkAd:
          $ref: '#/components/schemas/SourceLinkAd'
        trafficSource:
          $ref: '#/components/schemas/TrafficSource'
        goal:
          $ref: '#/components/schemas/Goal'
        category:
          $ref: '#/components/schemas/Category'
        gclId:
          type: string
          description: Only for Google.
        gbraId:
          type: string
          description: Only for Google.
        wbraId:
          type: string
          description: Only for Google.

    Price:
      type: object
      properties:
        currency:
          type: string
        price:
          type: number
        discount:
          type: number
        hardCost:
          type: number
        refunded:
          type: number

    Lead:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
        creationDate:
          type: string
          description: ISO 8601 date. When the lead is embedded in `/sales`, `/calls`, or `/subscriptions`, it is returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format for backward compatibility. 
          example: '2023-01-04T04:36:41-05:00'
        lastUpdatedDate:
          type: string
          example: '2023-06-10T09:12:00-05:00'
        tags:
          type: array
          items:
            type: string
        ips:
          type: array
          items:
            type: string
        phoneNumbers:
          type: array
          items:
            type: string
        firstName:
          type: string
        lastName:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        firstSource:
          $ref: '#/components/schemas/Attribution'
          description: First attributed source of the lead. Omitted when unknown.
        lastSource:
          $ref: '#/components/schemas/Attribution'
          description: Last attributed source of the lead. Omitted when unknown.
        originLead:
          $ref: '#/components/schemas/Lead'
          description: The origin lead this lead was merged into, when applicable. Omitted otherwise.
        isOriginLead:
          type: boolean
          description: Present on the leads journey (`GET /leads/journey`) and on the nested `originLead`; indicates the lead is an origin lead.

    LeadStage:
      type: object
      description: Current (most recent) stage of the lead.
      properties:
        name:
          type: string
          description: Name of the stage.
        date:
          type: string
          description: Date the stage was applied (ISO-8601 with timezone offset). Omitted when unavailable.

    LeadWithConsent:
      allOf:
        - $ref: '#/components/schemas/Lead'
        - type: object
          properties:
            adOptimizationConsent:
              $ref: '#/components/schemas/AdOptimizationConsent'

    LeadWithStage:
      allOf:
        - $ref: '#/components/schemas/LeadWithConsent'
        - type: object
          properties:
            currentStage:
              $ref: '#/components/schemas/LeadStage'
              description: Present only when the lead has a stage applied.

    SaleProduct:
      type: object
      description: Product information as it appears attached to a sale or call.
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
        sku:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        provider:
          $ref: '#/components/schemas/Provider'

    Product:
      type: object
      description: A product returned by the products listing endpoint.
      properties:
        id:
          type: string
          description: Product id (its tracking pixel).
        name:
          type: string
        tag:
          type: string
        sku:
          type: string
        price:
          type: number
        customCost:
          type: number
          description: Cost of goods of the product, used in profit and ROAS reporting.
        recurring:
          type: boolean
        callProduct:
          type: boolean
        category:
          type: string
          description: Category name.

    Sale:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        creationDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Jul 02 01:10:33 UTC 2026'
        refundDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601. Present only when the sale was refunded.
          example: 'Thu Jul 02 01:10:33 UTC 2026'
        qualified:
          type: boolean
        score:
          type: number
        recurring:
          type: boolean
        quantity:
          type: number
        lead:
          $ref: '#/components/schemas/Lead'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'
        price:
          $ref: '#/components/schemas/Price'
        product:
          $ref: '#/components/schemas/SaleProduct'
        provider:
          $ref: '#/components/schemas/Provider'

    CustomCost:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cost:
          type: number
        frequency:
          type: string
          enum: [DAILY, ONE_TIME, MONTHLY]
        startDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        endDate:
          type: string
          nullable: true
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        tags:
          type: array
          items:
            type: string

    Call:
      type: object
      properties:
        id:
          type: string
        tag:
          type: string
        qualified:
          type: boolean
        name:
          type: string
        externalId:
          type: string
        score:
          type: number
        creationDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        state:
          $ref: '#/components/schemas/CallState'
        qualification:
          type: object
          properties:
            name:
              type: string
            oldName:
              type: string
        lead:
          $ref: '#/components/schemas/Lead'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'

    Source:
      type: object
      properties:
        name:
          type: string
        tag:
          type: string
        disregarded:
          type: boolean
        organic:
          type: boolean
        adSource:
          $ref: '#/components/schemas/AdSource'
        trafficSource:
          $ref: '#/components/schemas/TrafficSource'
        goal:
          $ref: '#/components/schemas/Goal'
        category:
          $ref: '#/components/schemas/Category'
        creationDate:
          type: integer
          description: Returned as epoch milliseconds (a number) instead of ISO 8601.
          example: 1677151375000

    Subscription:
      type: object
      properties:
        id:
          type: string
        startDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        endDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        cancelAtDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        trialStartDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        trialEndDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: 'Thu Nov 17 10:51:54 ART 2022'
        price:
          type: number
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        periodicity:
          type: string
        planId:
          type: string
        tag:
          type: string
        name:
          type: string
        lead:
          $ref: '#/components/schemas/Lead'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'
        category:
          $ref: '#/components/schemas/Category'
          description: >-
            Category of the first paid sale item attributed to the subscription. Set once when the
            first payment is attributed and not updated if the plan changes later. Null when no
            paid sale has been attributed yet, for example a subscription still in its trial period.
        provider:
          $ref: '#/components/schemas/Provider'

    Cart:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
          description: Only present if cart was purchased.
        creationDate:
          type: string
          description: Cart creation date, in UTC.
          example: '2022-11-17T13:51:54Z'
        events:
          type: integer
        lead:
          $ref: '#/components/schemas/LeadWithConsent'
        provider:
          $ref: '#/components/schemas/Provider'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'

    LeadJourney:
      type: object
      properties:
        lead:
          $ref: '#/components/schemas/LeadWithStage'
        sales:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/Call'
        carts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              orderId:
                type: string
                description: Only present if cart was purchased.
              creationDate:
                type: string
                description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601, unlike the `creationDate` of `/carts`.
                example: 'Thu Nov 17 10:51:54 ART 2022'
              events:
                type: integer
              provider:
                $ref: '#/components/schemas/Provider'
              products:
                type: array
                items:
                  $ref: '#/components/schemas/SaleProduct'
              firstSource:
                $ref: '#/components/schemas/Attribution'
              lastSource:
                $ref: '#/components/schemas/Attribution'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        linkedLeads:
          type: array
          items:
            $ref: '#/components/schemas/LeadWithStage'
        journey:
          type: array
          description: Chronological journey events for the lead. Only present when `includeEvents=true`.
          items:
            $ref: '#/components/schemas/JourneyEvent'

    JourneyEvent:
      type: object
      description: A single event in a lead's journey (e.g. a sale, call, email, click or page view). Which fields are present depends on the event `type`.
      properties:
        type:
          type: string
          description: Event type. Examples include `sale`, `call`, `subscription-started`, `subscription-ended`, `email`, `email-open`, and tracking events such as clicks and page views.
        id:
          type: string
          description: Identifier of the underlying record. Present only for events backed by an external entity (`sale`, `call`, `subscription-started`, `subscription-ended`, `email`, `email-open`).
        date:
          type: string
          description: ISO 8601 timestamp (in the account timezone) when the event occurred.
        extra:
          type: string
          description: Additional context for the event.
        tag:
          type: string
        name:
          type: string
        keyword:
          type: string
        integrationProvider:
          type: string
          description: Source integration/provider associated with the event, when applicable.
        currencySymbol:
          type: string
          description: Currency symbol for monetary events (e.g. sales).
        emailSource:
          type: boolean
          description: Whether the event originated from an email source.
        subNames:
          type: array
          items:
            type: string
          description: Sub-element names, e.g. the individual products of a grouped cart event.

paths:
  /api/v1.0/leads:
    get:
      tags: [Leads]
      summary: Retrieve Leads
      description: |
        > [!NOTE]
        > **Required role** — Get Leads

        Search and retrieve leads by their join date, last updated date, email, phone number or id.
      parameters:
        - name: ids
          in: query
          description: Array of lead ids. At most 50 can be provided.
          schema:
            type: string
          example: '"id1","id2","id3"'
        - name: emails
          in: query
          description: Array of emails or email prefixes. At most 50 can be provided.
          schema:
            type: string
          example: '"email1","email2"'
        - name: phones
          in: query
          description: Array of phone numbers. At most 50 can be provided.
          schema:
            type: string
          example: '"+1 202-555-0184","2025550139"'
        - name: tags
          in: query
          description: Array of tag names. Leads matching any of the provided tags will be retrieved. Tags are matched exactly, including any prefix (e.g. `!Tag1`). At most 50 can be provided.
          schema:
            type: string
          example: '"!Tag1","!Tag2"'
        - name: stage
          in: query
          description: Array of stage names. Leads matching any of the provided stages will be retrieved. Stage names are matched case-insensitively. At most 50 can be provided.
          schema:
            type: string
          example: '"stage1","stage2"'
        - name: fromDate
          in: query
          description: ISO 8601 date. Only leads whose join date is more recent than this will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only leads whose join date is older than this will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedFromDate
          in: query
          description: ISO 8601 date. Only leads updated on or after this date will be retrieved. Use it to fetch just the leads that changed since your last request.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedToDate
          in: query
          description: ISO 8601 date. Only leads updated on or before this date will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of leads per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeadWithStage'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
              example:
                result:
                  - email: lead1@email.com
