  /api/v1.0/webhook-subscriptions:
    post:
      tags: [Webhook Subscriptions]
      summary: Create Webhook Subscription
      description: |
        > [!NOTE]
        > **Required role** — Create Webhook Subscriptions

        Create a webhook subscription. The subscription tells Hyros which event types to send,
        via **POST**, to the provided `targetUrl`. The response includes the generated
        `externalId` and the `secretKey` used to validate the HMAC signature of delivered events.
        The `secretKey` is returned only in this create response — store it, as it is not
        returned by the list endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, targetUrl, eventTypes]
              properties:
                name:
                  type: string
                  description: Name of the subscription.
                targetUrl:
                  type: string
                  description: |
                    URL where the event payloads are sent. Must be a public `http`/`https` URL and cannot contain template placeholders like `{{placeholder}}`.
