  /api/v1.0/custom-costs:
    get:
      tags: [Custom Costs]
      summary: Retrieve Custom Costs
      description: |
        > [!NOTE]
        > **Required role** — Get Custom Costs

        Retrieve custom costs. A cost matches the date window when its active range (from startDate to endDate, or
        open-ended when no endDate is set) overlaps the fromDate/toDate window. Use the returned id to update or delete a cost.
      parameters:
        - name: ids
          in: query
          description: Array of custom cost ids. At most 50 can be provided.
          schema:
            type: string
        - name: fromDate
          in: query
          description: ISO 8601 date. Only costs active on or after this date will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only costs active on or before this date will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of custom costs per page. Range 1-250. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomCost'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Custom Costs]
      summary: Create Custom Cost
      description: |
        > [!NOTE]
        > **Required role** — Create Custom Costs
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a custom cost with all necessary information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, frequency, cost, tags]
              properties:
                name:
                  type: string
                  description: Descriptive label for the cost.
                startDate:
                  type: string
                  description: ISO 8601 start date.
                endDate:
                  type: string
                  description: ISO 8601 end date.
                frequency:
                  type: string
                  enum: [DAILY, ONE_TIME]
                cost:
                  type: number
                  description: Must be greater than zero. Currency matches Hyros account settings.
                tags:
                  type: array
                  items:
                    type: string
                  description: Source tags to assign the costs to. Maximum 10.
                  maxItems: 10
            example:
              name: Monthly Agency Fee
              startDate: '2024-12-25T00:00:00.000Z'
              endDate: '2024-12-20T00:00:00.000Z'
              frequency: DAILY
              tags: ['@instagram', '@facebook']
              cost: 999.50
      responses:
        '200':
          description: Custom cost created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/custom-costs/{id}:
    put:
      tags: [Custom Costs]
      summary: Update Custom Cost
      description: |
        > [!NOTE]
        > **Required role** — Update Custom Costs

        Update a custom cost by its id. This is a full replacement: every field must be provided, and any omitted optional
        field is cleared. Costs created from the Hyros UI with a MONTHLY frequency are returned by the retrieve endpoint,
        but the API only accepts DAILY or ONE_TIME, so a MONTHLY cost cannot be edited through this endpoint without
        changing its frequency.
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the custom cost to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, frequency, cost, tags]
              properties:
                name:
                  type: string
                  description: Descriptive label for the cost.
                startDate:
                  type: string
                  description: ISO 8601 start date.
                endDate:
                  type: string
                  description: ISO 8601 end date.
                frequency:
                  type: string
                  enum: [DAILY, ONE_TIME]
                cost:
                  type: number
                  description: Must be greater than zero. Currency matches Hyros account settings.
                tags:
                  type: array
                  items:
                    type: string
                  description: Source tags to assign the costs to. Maximum 10.
                  maxItems: 10
            example:
              name: Monthly Agency Fee
              startDate: '2024-12-25T00:00:00.000Z'
              endDate: '2025-01-25T00:00:00.000Z'
              frequency: DAILY
              tags: ['@instagram', '@facebook']
              cost: 1299.50
      responses:
        '200':
          description: Custom cost updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Custom Costs]
      summary: Delete Custom Cost
      description: |
        > [!NOTE]
        > **Required role** — Delete Custom Costs

        Delete a custom cost by its id.
      parameters:
        - name: id
          in: path
          required: true
          description: Custom cost id to be deleted.
          schema:
            type: string
      responses:
        '200':
          description: Custom cost deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/clicks:
    post:
      tags: [Clicks]
      summary: Create Click
      description: |
        > [!NOTE]
        > **Required role** — Create Clicks
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Creates a click with the URL the user clicked on and a session id representing the potential lead session.
        Optionally includes an email to create a lead, and ad data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referrerUrl]
              properties:
                referrerUrl:
                  type: string
                  description: The URL for the click.
                sessionId:
                  type: string
                  description: Unique string representing the lead session.
                previousUrl:
                  type: string
                userAgent:
                  type: string
                ip:
                  type: string
                sourceLinkTag:
                  type: string
                  description: A `@tag` representing the ad. Must start with `@`.
                isOrganic:
                  type: boolean
                integrationType:
                  type: string
                  enum: [GOOGLE, GOOGLE_V2, FACEBOOK, TIKTOK, SNAPCHAT, LINKEDIN, TWITTER, PINTEREST, BING]
                  description: Subset of `AdspendType` accepted when creating a click.
                adSourceId:
                  type: string
                  description: |
                    Id of the group of ads. Required if `integrationType` is present.
                    - Facebook: adset id · Google: campaign id · TikTok: ad group id · Snapchat: ad squad id · LinkedIn: campaign id
                adspendAdId:
                  type: string
                  description: Id of the ad. Only for Facebook and Google.
                adSourceClickId:
                  type: string
                  description: Click id in the ad platform. Used for offline conversions (Facebook, Google, TikTok, Snapchat).
                email:
                  type: string
                phones:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                tag:
                  type: string
                  description: Tag to apply to the lead.
                date:
                  type: string
                  description: |
                    Date when the click was made. Allowed formats:
                    `yyyy-MM-ddTHH:mm:ssZ`, `yyyy-MM-ddTHH:mmZ`, `yyyy-MM-ddTHH:mm:ss+HH:mm`,
                    `yyyy-MM-ddTHH:mm+HH:mm`, `yyyy-MM-ddTHH:mm:ss`, `yyyy-MM-ddTHH:mm`, `yyyy-MM-dd`
            examples:
              organic:
                summary: Click for an organic ad
                value:
                  sessionId: RWp7VmL3nlAi6zdG0KKQ
                  referrerUrl: landing.page.com
                  previousUrl: previous.url
                  userAgent: Mozilla/5.0 (X11; Linux x86_64)
                  ip: 0.0.0.0
                  sourceLinkTag: '@facebook-post'
                  isOrganic: true
              platform:
                summary: Click for a platform ad
                value:
                  sessionId: RWp7VmL3nlAi6zdG0KKQ
                  referrerUrl: landing.page.com
                  ip: 0.0.0.0
                  integrationType: GOOGLE
                  adSourceId: '6500000028'
                  adspendAdId: '4800000004652'
                  adSourceClickId: Cj0KxxxxxxKQBhCNARIsACUEW_bnG48
              leadClick:
                summary: Click for a platform ad linked to a lead
                value:
                  sessionId: RWp7VmL3nlAi6zdG0KKQ
                  referrerUrl: landing.page.com
                  ip: 0.0.0.0
                  integrationType: GOOGLE
                  adSourceId: '6500000028'
                  adSourceClickId: Cj0KxxxxxxKQBhCNARIsACUEW_bnG48
                  email: new.lead@mail.com
                  phones: ['202-555-0139']
      responses:
        '200':
          description: Click created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/carts:
    get:
      tags: [Carts]
      summary: Retrieve Carts
      description: |
        > [!NOTE]
        > **Required role** — Get Carts

        Search and retrieve carts by creation date, purchased state (whether the cart has an
        associated order or not), email and lead id.
      parameters:
        - name: emails
          in: query
          description: Array of emails or prefixes. At most 50 can be provided.
          schema:
            type: string
        - name: leadIds
          in: query
          description: Array of leadIds. At most 50 can be provided.
          schema:
            type: string
        - name: purchased
          in: query
          description: Filter by purchased state. `true` returns only purchased carts (with orderId); `false` returns carts without orderId.
          schema:
            type: boolean
        - name: fromDate
          in: query
          description: ISO 8601 date. Only carts whose creation date is more recent than this will be retrieved.
          schema:
            type: string
          example: '2023-08-24T00:00:00-03:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only carts whose creation date is older than this will be retrieved.
          schema:
            type: string
          example: '2023-08-24T00:00:00-03:00'
        - name: pageSize
          in: query
          description: Maximum number of carts per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cart'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Carts]
      summary: Create Cart
      description: |
        > [!NOTE]
        > **Required role** — Create Carts
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a cart. Additionally, creates the lead if not already present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                cartId:
                  type: string
                  description: ID of the cart. A default one will be created if not included.
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                date:
                  type: string
                  description: ISO 8601 date. Timezone recommended.
                  example: '2021-04-16T20:35:00-06:00'
                priceFormat:
                  type: string
                  enum: [DECIMAL, INTEGER]
                  default: DECIMAL
                currency:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                  minItems: 1
            example:
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              email: john@doe.com
              firstName: John
              lastName: Doe
              date: '2021-09-06T12:00:12Z'
              currency: USD
              items:
                - name: T-shirt-blue
                  price: 9.5
                  externalId: '23456798'
                  quantity: 3
                  sku: DEPOR-XYZ-BLN-41
                  isRebill: false
              priceFormat: DECIMAL
              phoneNumbers: ['2345678901']
              leadIps: ['70.107.190.180']
      responses:
        '200':
          description: Cart created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: string
                  message:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Carts]
      summary: Update Cart
      description: |
        > [!NOTE]
        > **Required role** — Update Carts
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update a cart and its corresponding Lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, items]
              properties:
                cartId:
                  type: string
                  description: ID of the cart to update.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                  minItems: 1
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                phoneNumbers:
                  type: array
                  items:
                    type: string
                date:
                  type: string
                priceFormat:
                  type: string
                  enum: [DECIMAL, INTEGER]
                  default: DECIMAL
                currency:
                  type: string
            example:
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              email: john@doe.com
              date: '2021-09-06T12:00:12Z'
              currency: USD
              items:
                - name: T-shirt-red
                  price: 9.5
                  externalId: '23456333'
                  quantity: 1
                  sku: DEPOR-XYZ-RED-41
                  isRebill: false
              priceFormat: DECIMAL
      responses:
        '200':
          description: Cart updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

