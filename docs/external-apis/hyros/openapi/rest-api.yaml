  /api/v1.0/tracking-script:
    get:
      tags: [Tracking Script]
      summary: Get Tracking Script
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Clicks

        Retrieves the tracking script for a given domain. If no domain is provided, returns the default tracking script.
        The script can be customized with optional parameters to enable SPA tracking, ignore previous URLs, embed on iframes, or hide tracking parameters.
      parameters:
        - name: domain
          in: query
          description: Domain for which to retrieve the tracking script.
          schema:
            type: string
        - name: spa
          in: query
          description: Enables tracking of clicks and emails on URL change for Single Page Applications (SPA). Defaults to false.
          schema:
            type: boolean
            default: false
        - name: ignorePrevUrl
          in: query
          description: When true, ignores sources from the previous URL during attribution. Defaults to false.
          schema:
            type: boolean
            default: false
        - name: embed
          in: query
          description: When true, embeds the Universal script on iframes. Defaults to false.
          schema:
            type: boolean
            default: false
        - name: deleteTrackingScriptParams
          in: query
          description: When true, the Universal Script will automatically hide the tracking parameters in the URL after use. This setting is persisted as user metadata.
          schema:
            type: boolean
      responses:
        '200':
          description: Tracking script HTML.
          content:
            text/plain:
              schema:
                type: string
              example: |
                <script>
                    var head = document.head;
                    var script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.src = "https://api.hyros.com/v1/lst/universal-script?ph=a48210e63e83136228b90e18c16461c07ba3c7bee05ba64615ecae4edcf9d130&tag=!clicked&ref_url=" + encodeURIComponent(document.URL);
                    head.appendChild(script);
                </script>
        '400':
          description: Invalid domain.
          content:
            text/plain:
              schema:
                type: string

