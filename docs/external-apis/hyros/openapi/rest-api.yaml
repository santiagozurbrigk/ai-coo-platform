          schema:
            type: string
            enum: [ad_account, day, week, month, year]
            default: ad_account
        - name: ignoreRecurringSales
          in: query
          schema:
            type: boolean
            default: false
        - name: forecastingOption
          in: query
          schema:
            type: string
            enum: [first_sale, total_sales]
            default: first_sale
        - name: windowAttributionDaysRange
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 365
            default: 0
        - name: newCustomerConfiguration
          in: query
          schema:
            type: string
            enum: [all_customers, only_returning_customers, only_unique_customers]
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  request_id:
                    type: string
              example:
                result:
                  - id: '205044496234'
                    sales: 64
                    leads: 0
                    total_revenue: 9283.41
                    cost: 9172.25
                    cost_per_sale: 143.32
                    start_date: '2020-05-12T10:00:00'
                    end_date: '2021-04-13T10:00:00'
                request_id: d9031a3780c14ecdb8ca3af5cd26bc91
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/ad-accounts:
    get:
      tags: [Ad Accounts]
      summary: List Ad Accounts
      description: |
        > [!NOTE]
        > **Required role** — Get Ad Accounts

        List the ad accounts connected to your account. Use the returned `id`
        values as the ad account id for the Ad Attribution endpoint (with
        `isAdAccountId=true`) and the Ad Account Attribution endpoint.
        Results are paginated: each response includes a `nextPageId`; pass it
        back as `pageId` to retrieve the following page. The last page has a
        `null` `nextPageId`.
      parameters:
        - name: ids
          in: query
          required: false
          description: Comma-separated ad account ids to filter by. If omitted, all connected ad accounts are returned. A maximum of 50 ids may be provided.
          schema:
            type: string
          example: '205044496234,118822334455'
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to include in each result. If omitted, all fields are returned.
          schema:
            type: string
            enum: [name, type]
          example: 'name,type'
        - name: pageSize
          in: query
          required: false
          description: The maximum number of ad accounts to return in a single page. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: pageId
          in: query
          required: false
          description: The id of the next page to retrieve, taken from the `nextPageId` of a previous response. Any change to the other parameters resets pagination.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  nextPageId:
                    type: string
                    nullable: true
                    description: Cursor for the next page, or null on the last page.
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
              example:
                request_id: 43573923369e40bbafd46925a5c15ff5
                nextPageId: b8f1c2d3e4a5
                result:
                  - id: '205044496234'
                    name: Acme - Meta Ads
                    type: FACEBOOK
                  - id: '118822334455'
                    name: Acme - Google Ads
                    type: GOOGLE
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/products:
    post:
      tags: [Products]
      summary: Create Product
      description: |
        > [!NOTE]
        > **Required role** — Create Products
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a product with name, price and category. The tag is created from the product's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name:
                  type: string
                  description: Name of the product. Must have at least 3 characters.
                price:
                  type: number
                  description: 'Plain number only: up to 8 digits before the decimal point and up to 2 after (max 99999999.99). Currency symbols and separators are not accepted.'
                category:
                  type: string
                packages:
                  type: array
                  items:
                    type: string
                  description: Product packages (used for recurring sales attribution).
            example:
              name: Product 1
              price: 5.66
              category: Category 1
              packages: ['Package 1', 'Package 2']
      responses:
        '200':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Products]
      summary: Retrieve Products
      description: |
        > [!NOTE]
        > **Required role** — Get Products

        Search and retrieve products by name, tag, category and recurrence. Results are paginated.
      parameters:
        - name: name
          in: query
          description: Filter products whose name equals this value (exact match).
          schema:
            type: string
        - name: tag
          in: query
          description: Filter products whose tag equals this value (exact match). The sale prefix "$" is added automatically when omitted.
          schema:
            type: string
        - name: category
          in: query
          description: Filter products by the name of their category.
          schema:
            type: string
        - name: isRecurringSale
          in: query
          description: Filter by recurring status.
          schema:
            type: string
            enum: [RECURRING, NON_RECURRING, ALL]
            default: ALL
        - name: pageSize
          in: query
          description: Maximum number of products per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: pageId
          in: query
          description: ID of the next page. Returned in `nextPageId` of each response.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/products/{id}:
    put:
      tags: [Products]
      summary: Update Product
      description: |
        > [!NOTE]
        > **Required role** — Update Products

        Update a product's fields. Only the fields included in the request are modified; any field left out is kept unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: Product id (its tracking pixel, as returned by the products listing).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the product. Must have at least 3 characters.
                price:
                  type: number
                  description: 'Plain number only: up to 8 digits before the decimal point and up to 2 after (max 99999999.99). Currency symbols and separators are not accepted.'
                customCost:
                  type: number
                  description: Cost of goods of the product, used in profit and ROAS reporting.
                tag:
                  type: string
                sku:
                  type: string
                category:
                  type: string
                isRecurringSale:
                  type: boolean
                  description: Whether the product is a recurring sale. A product cannot be both a recurring sale and a call product.
                callProduct:
                  type: boolean
                  description: Whether the product is a call product. A product cannot be both a recurring sale and a call product.
                packages:
                  type: array
                  items:
                    type: string
                  description: Product packages (used for recurring sales attribution). Omit to keep the current packages unchanged; send an empty array to remove the product from all packages.
                updateHistoricalSales:
                  type: boolean
                  description: When true, a cost change is propagated to the product's existing sales, updating their profit and ROAS.
                  default: false
            example:
              price: 7.99
              customCost: 3.00
              updateHistoricalSales: true
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Products]
      summary: Delete Product
      description: |
        > [!NOTE]
        > **Required role** — Delete Products

        Delete a product by its id.
      parameters:
        - name: id
          in: path
          required: true
          description: Product id (its tracking pixel, as returned by the products listing) to be deleted.
          schema:
            type: string
      responses:
        '200':
          description: Product deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/tags:
    get:
      tags: [Tags]
