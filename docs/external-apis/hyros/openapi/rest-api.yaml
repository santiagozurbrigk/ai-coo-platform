        - name: includeDisregarded
          in: query
          schema:
            type: boolean
        - name: integrationType
          in: query
          schema:
            $ref: '#/components/schemas/AdspendType'
        - name: pageSize
          in: query
          description: Between 1 and 250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Sources]
      summary: Create Source
      description: |
        > [!NOTE]
        > **Required role** — Create Sources
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a source. Can be organic, non-organic, or from ad platforms (Google/Facebook/etc).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                category:
                  type: string
                goal:
                  type: string
                trafficSource:
                  type: string
                isDisregard:
                  type: boolean
                isOrganic:
                  type: boolean
                integrationType:
                  type: string
                  enum: [GOOGLE, FACEBOOK, TIKTOK, SNAPCHAT, LINKEDIN]
                  description: Subset of `AdspendType` accepted when creating a source.
                adSourceId:
                  type: string
                  description: |
                    Id of the ad. Required if `integrationType` is present.
                    - Facebook: adset id
                    - Google: campaign id
                    - TikTok: ad group id
                    - Snapchat: ad squad id
                    - LinkedIn: campaign id
                accountId:
                  type: string
                  description: Id of the ad account. Required if `integrationType` is present.
                adspendSubType:
                  $ref: '#/components/schemas/AdspendSubType'
                  description: Required when `integrationType` is GOOGLE.
                campaignId:
                  type: string
                  description: Required when `integrationType` is FACEBOOK.
            examples:
              organic:
                summary: Organic ad
                value:
                  name: Organic ad 1
                  category: Instagram posts
                  goal: opt ins
                  trafficSource: organic
                  isOrganic: true
              facebook:
                summary: Facebook ad
                value:
                  name: Facebook adset 1
                  integrationType: FACEBOOK
                  adSourceId: '238xxxxxxxx300546'
                  accountId: '32xxxxxxxx93135'
                  campaignId: '238xxxxxxxx300546'
      responses:
        '200':
          description: Source created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/sources/{tag}:
    put:
      tags: [Sources]
      summary: Update Source
      description: |
        > [!NOTE]
        > **Required role** — Update Sources
        >
        > **Asynchronous** — effect is not immediate (see note below).

        Edit an existing source, identified by its `tag`. Every field is optional: only the fields present in
        the request are changed, the rest are left untouched. Editing a source re-attributes its associated
        sales in the background.
        
        Note: the update is applied asynchronously. A `200` response means the request was accepted; the changes (and the re-attribution of associated sales) may take a few minutes to be reflected in `GET /api/v1.0/sources` and in reports.
      parameters:
        - name: tag
          in: path
          required: true
          description: The `tag` of the source to update, as returned by `GET /api/v1.0/sources`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name of the source.
                tag:
                  type: string
                  description: 'New tag to be assigned to the source (a new tag, or an existing one not used by another source). Must be a source tag: include the `@` prefix, e.g. `@my-source` (a value with no prefix is automatically prefixed with `@`). A tag with a non-source prefix (`$`, `!`, `#`) is rejected with `Invalid tag`.'
                category:
                  type: string
                  description: Name of the source category. Created if it does not exist.
                goal:
                  type: string
                  description: Name of the goal. Created if it does not exist.
                trafficSource:
                  type: string
                  description: Name of the traffic source. Created if it does not exist.
                isDisregard:
                  type: boolean
                  description: Whether the source is disregarded when attributing a sale.
                isOrganic:
                  type: boolean
                  description: Whether the source is marked as an organic source.
            example:
              name: Organic ad 1 (renamed)
              tag: '@organic-ad-1'
              category: Instagram posts
              isDisregard: true
      responses:
        '200':
          description: Source updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Sources]
      summary: Delete Source
      description: |
        > [!NOTE]
        > **Required role** — Delete Sources

        Delete an existing source, identified by its `tag`. The source is soft deleted and no longer appears in attribution.
      parameters:
        - name: tag
          in: path
          required: true
          description: The `tag` of the source to delete, as returned by `GET /api/v1.0/sources`.
          schema:
            type: string
      responses:
        '200':
          description: Source deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

