    post:
      tags: [Leads]
      summary: Create Lead
      description: |
        > [!NOTE]
        > **Required role** — Create Leads
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create or Update leads and their tags. If the applied Tag matches with that of a Product,
        a sale will be generated for said lead, only if it didn't already have the tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the lead. Required if no phone number is provided. If only a phone number is provided, a placeholder email `<phone>@hyrosapi.com` is generated and returned as the lead's email.
                firstName:
                  type: string
                lastName:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to apply to the lead.
                tagsDate:
                  type: string
                  description: Optional ISO-8601 date (`2023-05-01T10:00:00-03:00`) applied as the assignment date of **every** tag in `tags`, to backdate historical tags during imports, migrations or CRM syncs. Defaults to the current time when omitted. Cannot be in the future. To assign tags with different dates, send one request per date. If a tag generates a sale or a source attribution, those are backdated too.
                leadIps:
                  type: array
                  items:
                    type: string
                  description: IPs of the lead for ad attribution.
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Phone numbers of the lead. Required if no email is provided.
                stage:
                  type: string
                  description: Stage to apply to the lead. On create the stage is a plain string; on update (`PUT /leads`) it is set via the `leadStage` object (`{name, date}`) instead.
                adOptimizationConsent:
                  $ref: '#/components/schemas/AdOptimizationConsent'
            example:
              email: John@doe.com
              firstName: John
              lastName: Doe
              tags: ['!Tag1']
              tagsDate: '2023-05-01T10:00:00-03:00'
              leadIps: ['172.8.105.28']
              phoneNumbers: ['1105385366']
              stage: MQL
              adOptimizationConsent: GRANTED
      responses:
        '200':
          description: Lead created/updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Leads]
      summary: Update Lead
      description: |
        > [!NOTE]
        > **Required role** — Update Leads
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update leads and their tags.

        Tag assignments can be backdated with the optional `tagsDate` field (ISO-8601). It applies as the assignment date of **every** tag in `tags`, so historical tags keep an accurate timeline during imports, migrations or CRM syncs; it defaults to the current time when omitted and cannot be in the future. To assign tags with different dates, send one request per date. Tags the lead already has are ignored (their existing date is not changed). If a tag generates a sale or a source attribution, those are backdated too.
      parameters:
        - name: email
          in: query
          description: Email used to search for the lead to update.
          schema:
            type: string
        - name: id
          in: query
          description: ID used to search for the lead to update.
          schema:
            type: string
        - name: phone
          in: query
          description: Phone used to search for the lead to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: New email.
                firstName:
                  type: string
                lastName:
                  type: string
                tags:
                  type: array
                  description: Tags to add to the lead.
                  items:
                    type: string
                tagsDate:
                  type: string
                  description: Optional ISO-8601 date applied as the assignment date of every tag in `tags` (defaults to now, cannot be in the future). Tags the lead already has are ignored, not re-dated. For tags with different dates, send one request per date.
                removeTags:
                  type: array
                  description: Tags to remove from the lead.
                  items:
                    type: string
                leadIps:
                  type: array
                  items:
                    type: string
                phoneNumbers:
                  type: array
                  items:
                    type: string
                adOptimizationConsent:
                  $ref: '#/components/schemas/AdOptimizationConsent'
                leadStage:
                  type: object
                  description: Stage to apply to the lead on update. Create (`POST /leads`) uses a plain `stage` string instead.
                  properties:
                    name:
                      type: string
                    date:
                      type: string
            example:
              email: John@doe.com
              firstName: John
              lastName: Doe
              tags: ['!Tag1']
              tagsDate: '2023-05-01T10:00:00-03:00'
              removeTags: ['!Tag2']
              leadIps: ['172.8.105.28']
              phoneNumbers: ['1105385366']
              adOptimizationConsent: GRANTED
              leadStage:
                name: leadStageNameCINCO
                date: '2025-11-13T14:00:00-03:00'
      responses:
        '200':
          description: Lead updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Leads]
      summary: Delete Lead
      description: |
        > [!NOTE]
        > **Required role** — Delete Leads
        >
        > **Asynchronous** — the erasure applies immediately, but the lead typically takes ~5 minutes to disappear from `GET /leads`.

        Permanently delete a lead and its personal data. Provide one of email or id to identify the lead. Personal data is redacted, and phone numbers, sales and tracking data are deleted while subscriptions are cancelled.

        The lead's email address and phone numbers are also **blacklisted**, so later events carrying them are discarded instead of re-creating the lead. This cannot be undone through the API.
      parameters:
        - name: email
          in: query
          description: Email used to search for the lead to delete.
          schema:
            type: string
        - name: id
          in: query
          description: ID used to search for the lead to delete.
          schema:
            type: string
      responses:
        '200':
          description: Lead deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/leads/journey:
    get:
      tags: [Leads]
      summary: Retrieve Leads Journey
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Journey

        Retrieve the details about leads journeys using lead ids and/or emails. At least one of `ids` or `emails`
        must be provided. Emails are matched exactly (case-insensitive); an email may resolve to more than one
        lead, in which case one journey is returned per matched lead. Each journey includes the lead's sales,
        calls, carts, subscriptions and linked leads. Set `includeEvents=true` to additionally return a
        chronological `journey` array of events (sales, calls, emails, clicks, page views, etc.).
      parameters:
        - name: ids
          in: query
          description: Array of lead ids. At most 50 can be provided.
          schema:
            type: string
          example: '"id1","id2","id3"'
        - name: emails
          in: query
          description: Array of lead emails, matched exactly (case-insensitive). At most 50 can be provided.
          schema:
            type: string
          example: '"lead1@email.com","lead2@email.com"'
        - name: includeEvents
          in: query
          description: When `true`, each returned journey includes a `journey` array of chronological events (sales, calls, emails, clicks, page views, etc.). Defaults to `false`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeadJourney'
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/leads/clicks:
    get:
      tags: [Leads]
      summary: Retrieve Lead Clicks
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Clicks

        Retrieve clicks belonging to a lead. Either `leadId` or `email` must be provided.
      parameters:
        - name: leadId
          in: query
          description: The lead id.
          schema:
            type: string
        - name: email
          in: query
          description: The lead email.
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum number of clicks per page. Between 1 and 250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page.
          schema:
            type: string
        - name: fromDate
          in: query
          description: ISO 8601 date. Only clicks dated after this will be retrieved.
          schema:
            type: string
          example: '2025-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only clicks dated before this will be retrieved.
          schema:
            type: string
          example: '2025-04-16T20:35:00-05:00'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        date:
                          type: string
                          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
                          example: 'Thu Nov 17 10:51:54 ART 2022'
                        trackedUrl:
                          type: string
                        page:
                          type: string
                        previousUrl:
                          type: string
                        adspendType:
                          $ref: '#/components/schemas/AdspendType'
                        sourceLinkName:
                          type: string
                        ip:
                          type: string
                        agent:
                          type: string
                        cartId:
                          type: string
                        deduplicationParams:
                          type: object
                          additionalProperties: true
                        adSpendId:
                          type: integer
                        parsedParameters:
                          type: object
                          additionalProperties: true
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/sales:
    get:
      tags: [Sales]
      summary: Retrieve Sales
      description: |
        > [!NOTE]
        > **Required role** — Get Sales

        Search and retrieve sales by date, email, lead id, product tag, id, recurring status, and refund status.

        Filtering by `orderId` is **not** supported — the supported filters are the query parameters listed below; `orderId` is present only in the response body. Response `creationDate`/`refundDate` are returned in `EEE MMM dd HH:mm:ss zzz yyyy` format, not ISO 8601.
      parameters:
        - name: ids
          in: query
          description: Array of sales ids. At most 50 can be provided.
          schema:
            type: string
        - name: emails
          in: query
          description: Array of emails or prefixes. At most 50 can be provided.
          schema:
            type: string
        - name: leadIds
          in: query
          description: Array of leadIds. At most 50 can be provided.
          schema:
            type: string
        - name: productTags
          in: query
          description: Array of product tags. At most 20 can be provided.
          schema:
            type: string
        - name: isRecurringSale
          in: query
          description: Filter by recurring status.
          schema:
            type: string
            enum: [RECURRING, NON_RECURRING, ALL]
            default: ALL
        - name: saleRefundedState
          in: query
          description: Filter by refund status.
          schema:
            type: string
            enum: [REFUNDED, NON_REFUNDED, ALL]
            default: ALL
        - name: fromDate
          in: query
          description: ISO 8601 date. Only sales after this date will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only sales before this date will be retrieved.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of sales per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Sales]
      summary: Update Sales
      description: |
        > [!NOTE]
        > **Required role** — Update Sales
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update sales by their ids.
      parameters:
        - name: ids
          in: query
          required: true
          description: Array of sales ids. At most 50 can be provided.
          schema:
            type: string
        - name: isRecurringSale
          in: query
          description: Indicates if the sales will be recurring or not.
          schema:
            type: boolean
        - name: isRefunded
          in: query
          description: Indicates if the sales will be refunded or not.
          schema:
            type: boolean
        - name: refundedDate
          in: query
          description: ISO 8601 date. Optional even when `isRefunded` is true; if omitted, the refunded date is set to the present date.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: refundedAmount
          in: query
          description: Amount to be refunded.
          schema:
            type: string
      responses:
        '200':
          description: Sales updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/sales/{id}:
    delete:
      tags: [Sales]
      summary: Delete Sale
      description: |
        > [!NOTE]
        > **Required role** — Delete Sales
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Delete a sale by its id.
      parameters:
        - name: id
          in: path
          required: true
          description: Sale id to be deleted.
          schema:
            type: string
      responses:
        '200':
          description: Sale deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/orders:
    post:
      tags: [Orders]
      summary: Create Order
      description: |
        > [!NOTE]
        > **Required role** — Create Orders
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create an order with all necessary information. Additionally, creates the lead if not already present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                email:
                  type: string
                  description: Email associated with the lead. Required if no phone number is provided.
                parentEmail:
                  type: string
                  description: Email of the origin lead. If present, the sale will be attributed to the origin lead.
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                stage:
                  type: string
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Required if no email is provided.
                orderId:
                  type: string
                  description: Identifier by which sales will be grouped. Only letters, numbers, underscores, hyphens, periods, and colons. No spaces.
                externalSubscriptionId:
                  type: string
                cartId:
                  type: string
                date:
                  type: string
                  description: ISO 8601 date when the transaction was processed. Defaults to current date.
                  example: '2021-04-16T20:35:00'
                shippingCost:
                  type: number
                  description: Shipping cost distributed across items. Default is 0.
                taxes:
                  type: number
                  description: Order taxes distributed across items. Default is 0.
                orderDiscount:
                  type: number
                  description: Discount applied to the complete order, distributed evenly across all line items.
                priceFormat:
                  type: string
                  enum: [DECIMAL, INTEGER]
                  default: DECIMAL
                currency:
                  type: string
                  description: Currency code (e.g. EUR). Defaults to Hyros account setup.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Item'
                  minItems: 1
            example:
              email: john@doe.com
              parentEmail: jane@doe.com
              firstName: John
              lastName: Doe
              leadIps: ['172.8.105.28']
              stage: Customer
              phoneNumbers: ['1105385366']
              orderId: '56354354588'
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              date: '2021-04-16T20:35:00'
              priceFormat: DECIMAL
              currency: USD
              taxes: 98.6
              shippingCost: 10
              orderDiscount: 3.5
              items:
                - name: T-Shirt - Blue
                  price: 15.50
                  costOfGoods: 2.25
                  externalId: '18294892740'
                  quantity: 2
                  sku: DEPOR-XYZ-BLN-41
                  taxes: 2.5
                  itemDiscount: 2.5
                  packages: ['Package 1', 'Package 2']
                  isRebill: false
                  tag: $premiun-t-shirt-blue
                  categoryName: premium store
      responses:
        '200':
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/orders/{id}:
    put:
      tags: [Orders]
      summary: Update Order
      description: |
        > [!NOTE]
        > **Required role** — Update Orders
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update an order by replacing its items list and optionally updating order-level fields.
        The existing sales of the order are soft-deleted and recreated according to the provided items.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Identifier of the order to update. By default this is the order id used during creation.
            When `integrationType` is provided in the body, this value is matched against the `externalId`
            of any item belonging to the order; the whole order is then resolved through that item.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                integrationType:
                  type: string
                  description: External integration the order belongs to (e.g. STRIPE, SHOPIFY, KONNEKTIVE, API). When present, the path id is matched against an item externalId for that integration.
                  example: STRIPE
                stage:
                  type: string
                  description: Stage to apply to the customer's lead.
                externalSubscriptionId:
                  type: string
                cartId:
                  type: string
                shippingCost:
                  type: number
                  description: Shipping cost distributed across items. Default is 0.
                  example: 10.5
                taxes:
                  type: number
                  description: Order taxes distributed across items. Default is 0.
                  example: 9.8
                orderDiscount:
                  type: number
                  description: Discount applied to the complete order, distributed evenly across all line items.
                  example: 1.2
                priceFormat:
                  type: string
                  enum: [DECIMAL, INTEGER]
                  default: DECIMAL
                currency:
                  type: string
                  description: Currency code (e.g. EUR). Defaults to Hyros account setup.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Item'
                  minItems: 1
                  description: New items list. The existing items of the order will be replaced by this list.
            example:
              stage: Repeat Customer
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              priceFormat: DECIMAL
              currency: USD
              taxes: 98.6
              shippingCost: 10
              orderDiscount: 3.5
              items:
                - name: T-Shirt - Blue
                  price: 15.50
                  costOfGoods: 2.25
                  externalId: '18294892740'
                  quantity: 2
                  sku: DEPOR-XYZ-BLN-41
                  taxes: 2.5
                  itemDiscount: 2.5
                  isRebill: false
                  tag: $premiun-t-shirt-blue
                  categoryName: premium store
      responses:
        '200':
          description: Order updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Orders]
      summary: Refund Order
      description: |
        > [!NOTE]
        > **Required role** — Delete Orders
        >
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Refund an order by order id and update the income of the lead.
      parameters:
        - name: id
          in: path
          required: true
          description: Order id to be refunded.
          schema:
            type: string
        - name: refundedAmount
          in: query
          description: Amount to be refunded.
          schema:
            type: string
      responses:
        '200':
          description: Order refunded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1.0/calls:
    get:
      tags: [Calls]
      summary: Retrieve Calls
      description: |
        > [!NOTE]
        > **Required role** — Get Calls

        Search and retrieve calls by date, email, lead id, product tag or id.
      parameters:
        - name: ids
          in: query
          description: Array of call ids. At most 50 can be provided.
          schema:
            type: string
        - name: emails
          in: query
          description: Array of emails or prefixes. At most 50 can be provided.
          schema:
            type: string
        - name: leadIds
