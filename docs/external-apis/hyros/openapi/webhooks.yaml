  lead.stage.changed:
    post:
      summary: Lead Stage Changed
      description: |
        Triggered when a lead's **current** stage changes (for example moving from `MQL` to `SQL`).
        The event is only emitted when the applied stage becomes the lead's current stage — a stage
        applied with a date older than the lead's current stage (e.g. imports or backfilled orders)
        does not trigger it. `fromStage` is omitted when it is the first stage ever applied to the lead.
        The payload is sent via **POST** to your configured subscription URL.
      parameters:
        - $ref: '#/components/parameters/HmacSignatureHeader'
        - $ref: '#/components/parameters/HmacSha1Header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadStageChangedEvent'
            example:
              subscriptionId: sub-cee5ee3f380c4d8fb1286bac9e91fc1c
              eventId: evt-39ff6b3f9a694d619d0d8dd9193823f9
              type: lead.stage.changed
              timestamp: '2022-09-29T15:19:24-03:00'
              body:
                lead:
                  email: example@domain.com
                  firstName: Jerry
                  lastName: Howe
                  joinDate: '2022-09-29T15:19:23-03:00'
                  UTCJoinDate: '2022-09-29T15:19:23-03:00'
                  tags: ['vip', 'newsletter']
                fromStage: MQL
                toStage: SQL
                date: '2022-09-29T15:19:23-03:00'
                UTCDate: '2022-09-29T18:19:23-00:00'
      responses:
        '200':
          description: Event received successfully.

