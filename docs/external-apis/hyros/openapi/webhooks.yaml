                action: REMOVED
                date: '2022-09-29T15:19:23-03:00'
                UTCDate: '2022-09-29T15:19:23-03:00'
      responses:
        '200':
          description: Event received successfully.

components:
  parameters:
    HmacSignatureHeader:
      name: X-Hyros-Signature
      in: header
      required: true
      description: >-
        Recommended verification header. Format `t=<unix epoch seconds>,v1=<signature>`, where the
        signature is the lowercase hex-encoded HMAC-SHA256 of `<t>.<raw request body>`, computed with
        your subscription's `secretKey`. Verifying `t` against the current time protects against
        replayed requests. See "Verifying Webhook Signatures".
      schema:
        type: string
        example: t=1784730000,v1=4a7c1e2b9d8f6a5c3e0b1d2f4a6c8e0b1d3f5a7c9e0b2d4f6a8c0e1b3d5f7a9c
    HmacSha1Header:
      name: X-Hyros-Hmac-Sha1
      in: header
      required: true
      deprecated: true
      description: >-
        Deprecated — use `X-Hyros-Signature` instead. Lowercase hex-encoded HMAC-SHA1 signature of the
        raw JSON value of the event's `body` field, computed with your subscription's `secretKey`.
        Still sent on every request so existing integrations keep working.
        See "Verifying Webhook Signatures".
      schema:
        type: string
        example: 5f3a2b1c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a

  schemas:
    TrafficSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Goal:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    AdSource:
      type: object
      properties:
        adSourceId:
          type: string
          description: ID of the adset/campaign/adgroup in the Ads Manager.
        adAccountId:
          type: string
          description: ID of the ad account.
        platform:
          type: string
          enum: [GOOGLE, FACEBOOK, TIKTOK, SNAPCHAT, LINKEDIN, TWITTER, PINTEREST]

    SourceLinkAd:
      type: object
      properties:
        name:
          type: string
          description: Name of the ad.
        adSourceId:
          type: string
          description: ID of the ad in the Ads Manager.

    Attribution:
      type: object
      properties:
        sourceLinkId:
          type: string
        name:
          type: string
        tag:
          type: string
        disregarded:
          type: boolean
          description: Indicates whether the source is disregarded.
        organic:
          type: boolean
          description: Indicates whether the source is organic.
        trafficSource:
          $ref: '#/components/schemas/TrafficSource'
        goal:
          $ref: '#/components/schemas/Goal'
        category:
          $ref: '#/components/schemas/Category'
        clickDate:
          type: string
          description: Date of the first tracked click.
        UTCClickDate:
          type: string
          description: Date of the first tracked click in UTC.
        adSource:
          $ref: '#/components/schemas/AdSource'
        sourceLinkAd:
          $ref: '#/components/schemas/SourceLinkAd'

    LeadChild:
      type: object
      properties:
        email:
          type: string
        joinDate:
          type: string
        UTCJoinDate:
          type: string

    Lead:
      allOf:
        - $ref: '#/components/schemas/LeadChild'
        - type: object
          properties:
            ips:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            phoneNumbers:
              type: array
              items:
                type: string
            firstName:
              type: string
            lastName:
              type: string

    Price:
      type: object
      properties:
        price:
          type: number
        discount:
          type: number
        hardCost:
          type: number
        refunded:
          type: number
        currency:
          type: string
          description: Outbound currency configured in Hyros (default USD).

    Product:
      type: object
      properties:
        id:
          type: string
        quantity:
          type: number
        name:
          type: string
        tag:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        price:
          $ref: '#/components/schemas/Price'
          description: Price in the outbound currency configured in Hyros.
        USDPrice:
          $ref: '#/components/schemas/Price'
          description: Price in USD.

    EventBase:
      type: object
      required: [subscriptionId, eventId, type, timestamp]
      properties:
        subscriptionId:
          type: string
          description: ID of the subscription.
        eventId:
          type: string
          description: ID of the event. Can be used for deduplication.
        type:
          type: string
          description: Type of the event.
        timestamp:
          type: string
          description: Timestamp when the event was sent.
          example: '2022-09-28T15:38:48-03:00'

    SaleEntity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [SALE]
        date:
          type: string
          description: Date of the sale in the user's timezone.
        UTCDate:
          type: string
          description: Date of the sale in UTC.
        qualified:
          type: boolean
          description: True if the sale score is 1.
        score:
          type: number
        orderId:
          type: string
        recurring:
          type: boolean
        attribution:
          type: array
          items:
            $ref: '#/components/schemas/Attribution'
        lead:
          $ref: '#/components/schemas/Lead'
        product:
          $ref: '#/components/schemas/Product'

    SaleAttributedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [sale.attributed]
            body:
              $ref: '#/components/schemas/SaleEntity'

    SaleRefundedEntity:
      allOf:
        - $ref: '#/components/schemas/SaleEntity'
        - type: object
          properties:
            refundedDate:
              type: string
              description: >-
                Date the sale was refunded. The refunded amount is available in
                `product.price.refunded` (and `product.USDPrice.refunded`).

    SaleRefundedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [sale.refunded]
            body:
              $ref: '#/components/schemas/SaleRefundedEntity'

    LeadOptInEntity:
      type: object
      properties:
        id:
          type: string
        firstOptin:
          type: boolean
          description: Identifies whether it is the first opt-in for that lead.
        date:
          type: string
          description: Date the lead opted in (user timezone).
        UTCDate:
          type: string
          description: Date the lead opted in (UTC).
        referrerUrl:
          type: string
          description: Referrer URL from which the lead opted in.
        lead:
          $ref: '#/components/schemas/Lead'
        attribution:
          type: array
          items:
            $ref: '#/components/schemas/Attribution'
          description: All attributions the lead has.
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'

    LeadOptInEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [lead.opted.in]
            body:
              $ref: '#/components/schemas/LeadOptInEntity'

    LeadOriginAssignedEntity:
      type: object
      properties:
        mechanism:
          type: string
          enum: [SESSION_ID, PHONE_NUMBER, IP, MANUAL]
          description: Mechanism by which the lead was assigned as origin.
        lead:
          $ref: '#/components/schemas/LeadChild'
          description: Information of the lead assigned as a child.
        originLead:
          $ref: '#/components/schemas/Lead'
          description: Information of the lead assigned as origin.
        date:
          type: string
          description: Time of the origin lead assignment (user timezone).
        UTCDate:
          type: string
          description: Time of the origin lead assignment (UTC).
        matchingValues:
          type: array
          items:
            type: string
          description: Values for which the two leads were matched.

    LeadOriginAssignedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [lead.origin.assigned]
            body:
              $ref: '#/components/schemas/LeadOriginAssignedEntity'

    CallEntity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [CALL]
        date:
          type: string
          description: Date of the call (user timezone).
        UTCDate:
          type: string
          description: Date of the call (UTC).
        qualified:
          type: boolean
        score:
          type: number
        tag:
          type: string
        attribution:
          type: array
          items:
            $ref: '#/components/schemas/Attribution'
        lead:
          $ref: '#/components/schemas/Lead'

    CallAttributedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [call.attributed]
            body:
              $ref: '#/components/schemas/CallEntity'

    SubscriptionStatus:
      type: string
      enum: [ACTIVE, TRIALING, CANCELED, PAST_DUE, INCOMPLETE, INCOMPLETE_EXPIRED, UNPAID, COMPLETED, PAUSED, UNKNOWN]

    BillingPeriodType:
      type: string
      enum: [DAY, WEEK, MONTH, QUARTER, YEAR]

    Integration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: Name of the external integration type (e.g. `STRIPE`, `PAYPAL`, `SHOPIFY`).

    Provider:
      type: object
      properties:
        id:
          type: string
        integration:
          $ref: '#/components/schemas/Integration'

    SubscriptionLead:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        creationDate:
          type: string
          description: Date the lead was created.
        firstName:
          type: string
        lastName:
          type: string
        ips:
          type: array
          items:
            type: string
        phoneNumbers:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        provider:
          $ref: '#/components/schemas/Provider'

    SubscriptionEntity:
      type: object
      properties:
        id:
          type: string
          description: ID of the subscription.
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        name:
          type: string
        tag:
          type: string
        planId:
          type: string
        price:
          type: number
        periodicity:
          $ref: '#/components/schemas/BillingPeriodType'
        startDate:
          type: string
          nullable: true
          description: Start date of the subscription. May be `null`.
        endDate:
          type: string
          nullable: true
        cancelAtDate:
          type: string
          nullable: true
        trialStartDate:
          type: string
          nullable: true
        trialEndDate:
          type: string
          nullable: true
        lead:
          $ref: '#/components/schemas/SubscriptionLead'
          description: Lead associated with the subscription. May be `null`.
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'
        provider:
          $ref: '#/components/schemas/Provider'
        category:
          $ref: '#/components/schemas/Category'

    SubscriptionCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [subscription.created]
            body:
              $ref: '#/components/schemas/SubscriptionEntity'

    SubscriptionStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [subscription.status.changed]
            body:
              $ref: '#/components/schemas/SubscriptionEntity'

    LeadStageChangeEntity:
      type: object
      properties:
        lead:
          $ref: '#/components/schemas/Lead'
          description: Information of the lead whose stage changed.
        fromStage:
          type: string
          description: Name of the lead's previous stage. Omitted when this is the first stage ever applied to the lead.
        toStage:
          type: string
          description: Name of the lead's new current stage.
        date:
          type: string
          description: Time at which the stage was applied, in the account's time zone.
        UTCDate:
          type: string
          description: Time at which the stage was applied, in UTC.

    LeadTagChangeEntity:
      type: object
      properties:
        lead:
          $ref: '#/components/schemas/Lead'
          description: Full lead snapshot after the change.
        tags:
          type: array
          items:
            type: string
          description: Only the tag names that changed (added or removed, depending on the event). Capped at the last 30 tags.
        action:
          type: string
          enum: [ADDED, REMOVED]
          description: Whether the tags were added or removed.
        date:
          type: string
          description: Time of the change in the account's time zone.
        UTCDate:
          type: string
          description: Time of the change in UTC.

    LeadStageChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [lead.stage.changed]
            body:
              $ref: '#/components/schemas/LeadStageChangeEntity'

    LeadTagAddedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [lead.tag.added]
            body:
              $ref: '#/components/schemas/LeadTagChangeEntity'

    LeadTagRemovedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            type:
              type: string
              enum: [lead.tag.removed]
            body:
              $ref: '#/components/schemas/LeadTagChangeEntity'
