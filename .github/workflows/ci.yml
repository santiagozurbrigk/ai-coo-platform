name: CI

on:
  push:
    branches: [main, "Claude-*", "claude/**", "feat/**", "fix/**", "chore/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  # Arma una base desde cero con todas las migraciones de supabase/migrations.
  # Frena una migración que no corre, una versión repetida o un nombre inválido
  # antes de que lleguen a producción. Ver supabase/ci/check-migrations.sh.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma versión mayor que producción (Supabase, Postgres 17), con pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - run: supabase/ci/check-migrations.sh
